<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mangrove</title>
    <script>
      // Applied before React mounts so a stored non-default theme doesn't
      // flash the default palette for a frame -- theme.tsx's ThemeProvider
      // re-applies (and keeps in sync) once it mounts.
      try {
        var t = localStorage.getItem("mangrove-theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--

      a living system -- refusing the generic navy-blue SaaS admin panel default.
      OWN-WORLD: warm near-black "instrument room at night" ground; brass/amber
      as the primary interactive accent; oxidized-copper verdigris green for
      healthy/success; sealing-wax red for danger, ochre for warning; Space
      Grotesk for UI/display, IBM Plex Mono for every numeric/log/coordinate
      readout; ruled-ledger tables; engraved-plaque uppercase labels; gauge-dial
      resource meters; seismograph-strip log/timeline visualization.
      STORY: an operator opens the dashboard and reads it as a serious
      instrument panel for infrastructure they own -- glances at gauges for
      resource health, ledger for what's deployed, an ambient station/site
      switcher for workspace context, a strip-chart for live activity -- and
      acts (deploy, roll back, open a terminal) with confidence.
      FIRST VIEWPORT: sidebar with a station/site (workspace) switcher pinned
      at top; main area shows a ledger of projects/deployments with status
      beacons, a primary "+ New" action in brass.
      FORM: Field Station / Instrument Room -- direction 5 of 7, seed key 6a95b778.
      FINISH: unreviewed and undocumented is unfinished; this build ends with

    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
