## Drop-in that puts Caddy under mangrove.slice's protected memory floor,
## alongside mangrove.service, so the reverse proxy can't be starved by a
## runaway deployment container either.
##
## Install: mkdir -p /etc/systemd/system/caddy.service.d && copy this file
## to /etc/systemd/system/caddy.service.d/mangrove-slice.conf, then
## `systemctl daemon-reload && systemctl restart caddy`.

[Service]
Slice=mangrove.slice
OOMScoreAdjust=-500
