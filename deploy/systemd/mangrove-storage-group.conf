## Drop-in for mangrove.service, NOT a standalone unit -- adds the
## mangrove-mount supplementary group so the main mangrove process can
## reach mangrove-mountd's socket (0660, root:mangrove-mount -- see
## mangrove-mountd.service). Install only if you're setting up the
## storage/NAS feature; a box with nothing plugged into it doesn't need
## this, and mangrove.service works fine without it (Storage page just
## shows "helper not reachable").
##
## Install:
##   mkdir -p /etc/systemd/system/mangrove.service.d
##   cp deploy/systemd/mangrove-storage-group.conf /etc/systemd/system/mangrove.service.d/storage-group.conf
##   systemctl daemon-reload && systemctl restart mangrove
##
## Deliberately a drop-in rather than an edit to mangrove.service's own
## SupplementaryGroups= line: that line ships in every install regardless
## of whether storage is used, and a group that doesn't exist yet
## (mangrove-mountd.service's own install step creates it) would fail
## mangrove.service to start on every box that hasn't opted in.
[Service]
SupplementaryGroups=mangrove-mount
